<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1460" width="1200" height="1460" role="img" aria-labelledby="title desc">
<title id="title">E–G · 闭环执行与场景理解</title><desc id="desc">E/F：指令 → 动作 → 轨迹 → 控制 → 状态反馈；G：相机输入 → 场景描述 → 独立审计。</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#f1f5fb"/></linearGradient>
<marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="#2563eb"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="#059669"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="#b45309"/></marker><marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="#7c3aed"/></marker></defs>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.flow{stroke-dasharray:8 7;animation:travel 1.4s linear infinite}
.side{stroke-dasharray:5 7;animation:travel 2s linear infinite}
.feedback{stroke-dasharray:12 7;animation:travel 1.8s linear infinite}
@keyframes travel{to{stroke-dashoffset:-30}}
@media(prefers-reduced-motion:reduce){.flow,.side,.feedback{animation:none}}
</style>
<rect width="1200" height="1460" rx="24" fill="url(#bg)"/>
<rect x="36" y="32" width="6" height="60" rx="3" fill="#059669"/>
<text x="60" y="65" font-size="31" fill="#172554" font-weight="750" text-anchor="start">E–G · 闭环执行与场景理解</text><text x="60" y="99" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">E/F：指令 → 动作 → 轨迹 → 控制 → 状态反馈；G：相机输入 → 场景描述 → 独立审计。</text><g><rect x="36" y="150" width="340" height="200" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="36" y="150" width="340" height="52" rx="18" fill="#ecfdf5"/><path d="M36 184h340v18H36z" fill="#ecfdf5"/><rect x="54" y="164" width="30" height="26" rx="8" fill="#059669"/><text x="69" y="183" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">01</text><text x="97" y="184" font-size="21" fill="#172554" font-weight="700" text-anchor="start">E/F 试验与环境配置</text><text x="56" y="233" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">E：5 类指令 × 10 trial = 50 次</text><text x="56" y="262" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">F：5 种环境 × 5 指令 = 25 次</text><text x="56" y="291" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">晴空 / 暴雨 / 浓雾 / 夜晚 / 逆光</text><text x="56" y="320" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">窗口按 CARLA 仿真时钟判定</text></g><g><rect x="430" y="150" width="340" height="200" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="430" y="150" width="340" height="52" rx="18" fill="#ecfdf5"/><path d="M430 184h340v18H430z" fill="#ecfdf5"/><rect x="448" y="164" width="30" height="26" rx="8" fill="#059669"/><text x="463" y="183" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">02</text><text x="491" y="184" font-size="21" fill="#172554" font-weight="700" text-anchor="start">指令规则 → 离散动作</text><text x="450" y="233" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">FORWARD / LEFT / RIGHT</text><text x="450" y="262" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">SPEED_UP / SLOW_DOWN</text><text x="450" y="291" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">意图由固定指令显式提供</text><text x="450" y="320" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">不代表模型自主决定驾驶动作</text></g><g><rect x="824" y="150" width="340" height="200" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="824" y="150" width="340" height="52" rx="18" fill="#f5f3ff"/><path d="M824 184h340v18H824z" fill="#f5f3ff"/><rect x="842" y="164" width="30" height="26" rx="8" fill="#7c3aed"/><text x="857" y="183" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">03</text><text x="885" y="184" font-size="21" fill="#172554" font-weight="700" text-anchor="start">真实模型：A → T 展开</text><text x="844" y="233" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">InternVL / DriveTDPAPredictor</text><text x="844" y="262" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">真实模型，mock=false</text><text x="844" y="291" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">按给定动作生成几何轨迹</text><text x="844" y="320" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">此处关注动作到轨迹的执行链</text></g><path d="M376 250H430" fill="none" stroke="#059669" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#green)"/><path d="M770 250H824" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#purple)"/><path d="M994 350V405" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#purple)"/><g><rect x="824" y="405" width="340" height="200" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="824" y="405" width="340" height="52" rx="18" fill="#f5f3ff"/><path d="M824 439h340v18H824z" fill="#f5f3ff"/><rect x="842" y="419" width="30" height="26" rx="8" fill="#7c3aed"/><text x="857" y="438" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">04</text><text x="885" y="439" font-size="21" fill="#172554" font-weight="700" text-anchor="start">RAT 输出 → YAML 航点</text><text x="844" y="488" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">Reasoning → Action → Trajectory</text><text x="844" y="517" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">输出轨迹与可审计中间表示</text><text x="844" y="546" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">YAML 航点进入下游控制接口</text><text x="844" y="575" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">报告未在此证明自由轨迹质量</text></g><g><rect x="430" y="405" width="340" height="200" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="430" y="405" width="340" height="52" rx="18" fill="#eff6ff"/><path d="M430 439h340v18H430z" fill="#eff6ff"/><rect x="448" y="419" width="30" height="26" rx="8" fill="#2563eb"/><text x="463" y="438" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">05</text><text x="491" y="439" font-size="21" fill="#172554" font-weight="700" text-anchor="start">ROS 2 轨迹接口</text><text x="450" y="488" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">传递轨迹与车辆状态消息</text><text x="450" y="517" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">轨迹接口：/drivetdpa/trajectory</text><text x="450" y="546" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">关联帧、时间戳与执行记录</text><text x="450" y="575" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">ROS / CARLA 时钟保持一致</text></g><g><rect x="36" y="405" width="340" height="200" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="36" y="405" width="340" height="52" rx="18" fill="#eff6ff"/><path d="M36 439h340v18H36z" fill="#eff6ff"/><rect x="54" y="419" width="30" height="26" rx="8" fill="#2563eb"/><text x="69" y="438" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">06</text><text x="97" y="439" font-size="21" fill="#172554" font-weight="700" text-anchor="start">Autoware E2E 控制</text><text x="56" y="488" font-size="16" fill="#53627b" font-weight="400" text-anchor="start">trajectory_follower：MPC + PID</text><text x="56" y="517" font-size="16" fill="#53627b" font-weight="400" text-anchor="start">shift_decider → external_cmd_selector</text><text x="56" y="546" font-size="16" fill="#53627b" font-weight="400" text-anchor="start">vehicle_cmd_gate</text><text x="56" y="575" font-size="16" fill="#53627b" font-weight="400" text-anchor="start">raw_vehicle_cmd_converter</text></g><path d="M824 505H770" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#blue)"/><path d="M430 505H376" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#blue)"/><path d="M206 605V685" fill="none" stroke="#059669" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#green)"/><text x="220" y="659" font-size="16" fill="#059669" font-weight="600" text-anchor="start">控制量</text><g><rect x="36" y="685" width="340" height="190" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="36" y="685" width="340" height="52" rx="18" fill="#ecfdf5"/><path d="M36 719h340v18H36z" fill="#ecfdf5"/><rect x="54" y="699" width="30" height="26" rx="8" fill="#059669"/><text x="69" y="718" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">07</text><text x="97" y="719" font-size="21" fill="#172554" font-weight="700" text-anchor="start">CARLA 车辆执行</text><text x="56" y="768" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">执行转向、油门与制动控制</text><text x="56" y="797" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">车辆从状态 t 演化至 t+1</text><text x="56" y="826" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">产生实时位姿、速度与相机帧</text><text x="56" y="855" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">控制器持续接收新状态</text></g><g><rect x="430" y="685" width="340" height="190" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="430" y="685" width="340" height="52" rx="18" fill="#eff6ff"/><path d="M430 719h340v18H430z" fill="#eff6ff"/><rect x="448" y="699" width="30" height="26" rx="8" fill="#2563eb"/><text x="463" y="718" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">08</text><text x="491" y="719" font-size="21" fill="#172554" font-weight="700" text-anchor="start">状态反馈与过程记录</text><text x="450" y="768" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">位姿 / 速度 / 偏航变化</text><text x="450" y="797" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">对齐 CARLA 仿真时间</text><text x="450" y="826" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">反馈给轨迹跟踪控制器</text><text x="450" y="855" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">记录 trial 内执行过程</text></g><g><rect x="824" y="685" width="340" height="190" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="824" y="685" width="340" height="52" rx="18" fill="#fffbeb"/><path d="M824 719h340v18H824z" fill="#fffbeb"/><rect x="842" y="699" width="30" height="26" rx="8" fill="#b45309"/><text x="857" y="718" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">09</text><text x="885" y="719" font-size="21" fill="#172554" font-weight="700" text-anchor="start">5 仿真秒执行判据</text><text x="844" y="768" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">按指令检查速度 / 偏航 / Δv</text><text x="844" y="797" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">输出 success、v_peak、v_end 等</text><text x="844" y="826" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">成功表示指令动作已执行</text><text x="844" y="855" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">不等于轨迹正确或规划合理</text></g><path d="M376 780H430" fill="none" stroke="#059669" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#green)"/><path d="M770 780H824" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#amber)"/><path d="M600 685V640H18V505H36" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="feedback" marker-end="url(#blue)"/><text x="325" y="630" font-size="17" fill="#2563eb" font-weight="700" text-anchor="start">连续反馈：车辆状态 → 轨迹跟踪</text><g><rect x="430" y="915" width="734" height="95" rx="16" fill="#ecfdf5" stroke="#059669" stroke-opacity=".22"/><text x="448" y="944" font-size="19" fill="#059669" font-weight="700" text-anchor="start">E/F 最终汇总与发布</text><text x="448" y="972" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">E：50/50；F：25/25；记录成功率、转向幅度和速度变化。</text><text x="448" y="998" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">逐次 CSV 与汇总已发布：ag_final/E/、F/。</text></g><path d="M994 875V915" fill="none" stroke="#059669" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#green)"/><path d="M36 780H18V1175H36" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="side" marker-end="url(#purple)"/><text x="37" y="954" font-size="17" fill="#7c3aed" font-weight="600" text-anchor="start">相机实时帧</text><text x="36" y="1060" font-size="23" fill="#7c3aed" font-weight="750" text-anchor="start">G · 场景理解侧支路｜独立审计，不决定 E/F 的驾驶动作</text><g><rect x="36" y="1090" width="340" height="180" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="36" y="1090" width="340" height="52" rx="18" fill="#f5f3ff"/><path d="M36 1124h340v18H36z" fill="#f5f3ff"/><rect x="54" y="1104" width="30" height="26" rx="8" fill="#7c3aed"/><text x="69" y="1123" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">G1</text><text x="97" y="1124" font-size="21" fill="#172554" font-weight="700" text-anchor="start">CARLA CAM_FRONT</text><text x="56" y="1173" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">实时前视图像</text><text x="56" y="1202" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">来自仿真环境的独立观察路径</text><text x="56" y="1231" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">保留图像与场景 hash</text></g><g><rect x="430" y="1090" width="340" height="180" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="430" y="1090" width="340" height="52" rx="18" fill="#f5f3ff"/><path d="M430 1124h340v18H430z" fill="#f5f3ff"/><rect x="448" y="1104" width="30" height="26" rx="8" fill="#7c3aed"/><text x="463" y="1123" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">G2</text><text x="491" y="1124" font-size="21" fill="#172554" font-weight="700" text-anchor="start">真实 LVLM 场景描述</text><text x="450" y="1173" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">Talk2BEV-compatible 理解输出</text><text x="450" y="1202" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">BEV 对象为空，主要依靠相机</text><text x="450" y="1231" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">官方 Talk2BEV 上游未执行</text></g><g><rect x="824" y="1090" width="340" height="180" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="824" y="1090" width="340" height="52" rx="18" fill="#f5f3ff"/><path d="M824 1124h340v18H824z" fill="#f5f3ff"/><rect x="842" y="1104" width="30" height="26" rx="8" fill="#7c3aed"/><text x="857" y="1123" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">G3</text><text x="885" y="1124" font-size="21" fill="#172554" font-weight="700" text-anchor="start">模型 / 消息 / hash 审计</text><text x="844" y="1173" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">检查真实模型身份与有效消息</text><text x="844" y="1202" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">54/54 消息审计通过</text><text x="844" y="1231" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">逐消息时间线 / 审计 / 日志已发布</text></g><path d="M376 1175H430" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#purple)"/><path d="M770 1175H824" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#purple)"/><g><rect x="36" y="1300" width="1128" height="83" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity=".22"/><text x="54" y="1329" font-size="19" fill="#b45309" font-weight="700" text-anchor="start">实测范围</text><text x="54" y="1357" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">E/F 验证指令执行链；G 验证兼容场景理解与消息审计。未把 preference selector 或完整官方 Talk2BEV 画作必经模块。</text></g><text x="36" y="1420" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">流线表示处理顺序与反馈方向；这是流程演示动画，不是实时遥测。</text><text x="36" y="1448" font-size="16" fill="#53627b" font-weight="400" text-anchor="start">依据：E–G Final 报告 / 汇总、报告描述的控制链与 ROS 2 接口文档；不表示在线训练或实时指标。</text></svg>