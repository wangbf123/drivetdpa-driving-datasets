<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1070" width="1200" height="1070" role="img" aria-labelledby="title desc">
<title id="title">A–D · 开环实验流程</title><desc id="desc">离线数据 → 训练与消融 → 预测对比 → 统计复核；预测不会改变数据中的车辆状态。</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#f1f5fb"/></linearGradient>
<marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="#2563eb"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="#059669"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="#b45309"/></marker><marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="#7c3aed"/></marker></defs>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.flow{stroke-dasharray:8 7;animation:travel 1.4s linear infinite}
.side{stroke-dasharray:5 7;animation:travel 2s linear infinite}
.feedback{stroke-dasharray:12 7;animation:travel 1.8s linear infinite}
@keyframes travel{to{stroke-dashoffset:-30}}
@media(prefers-reduced-motion:reduce){.flow,.side,.feedback{animation:none}}
</style>
<rect width="1200" height="1070" rx="24" fill="url(#bg)"/>
<rect x="36" y="32" width="6" height="60" rx="3" fill="#2563eb"/>
<text x="60" y="65" font-size="31" fill="#172554" font-weight="750" text-anchor="start">A–D · 开环实验流程</text><text x="60" y="99" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">离线数据 → 训练与消融 → 预测对比 → 统计复核；预测不会改变数据中的车辆状态。</text><g><rect x="36" y="150" width="340" height="230" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="36" y="150" width="340" height="52" rx="18" fill="#eff6ff"/><path d="M36 184h340v18H36z" fill="#eff6ff"/><rect x="54" y="164" width="30" height="26" rx="8" fill="#2563eb"/><text x="69" y="183" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">01</text><text x="97" y="184" font-size="21" fill="#172554" font-weight="700" text-anchor="start">NuScenes 数据准备</text><text x="56" y="233" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">CAM_FRONT 图像与场景元数据</text><text x="56" y="262" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">ego pose / annotations</text><text x="56" y="291" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">构建场景上下文、RAT 监督样本</text><text x="56" y="320" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">动作标签由 GT 轨迹启发式推导</text><text x="56" y="349" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">图像与模型权重需外部准备</text></g><g><rect x="430" y="150" width="340" height="230" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="430" y="150" width="340" height="52" rx="18" fill="#eff6ff"/><path d="M430 184h340v18H430z" fill="#eff6ff"/><rect x="448" y="164" width="30" height="26" rx="8" fill="#2563eb"/><text x="463" y="183" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">02</text><text x="491" y="184" font-size="21" fill="#172554" font-weight="700" text-anchor="start">按场景切分，避免泄漏</text><text x="450" y="233" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">训练：2523 样本 / 841 场景</text><text x="450" y="262" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">held-out：180 样本 / 9 场景</text><text x="450" y="291" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">day / night / rain 各 3 场景</text><text x="450" y="320" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">训练与评估场景不重叠</text><text x="450" y="349" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">推理输入不包含未来 GT 轨迹</text></g><g><rect x="824" y="150" width="340" height="230" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="824" y="150" width="340" height="52" rx="18" fill="#f5f3ff"/><path d="M824 184h340v18H824z" fill="#f5f3ff"/><rect x="842" y="164" width="30" height="26" rx="8" fill="#7c3aed"/><text x="857" y="183" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">03</text><text x="885" y="184" font-size="21" fill="#172554" font-weight="700" text-anchor="start">SFT → 偏好训练</text><text x="844" y="233" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">InternVL 3.5-1B；seed 42/17/23</text><text x="844" y="262" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">每个 seed：A1 SFT 200 步</text><text x="844" y="291" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">同 seed A1 → A2 / A3 / A4</text><text x="844" y="320" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">各偏好训练 200 步；surrogate 对</text><text x="844" y="349" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">4 配置 × 3 seed = 12 checkpoints</text></g><path d="M376 265H430" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#blue)"/><path d="M770 265H824" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#purple)"/><path d="M994 380V560" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#purple)"/><text x="1008" y="473" font-size="17" fill="#7c3aed" font-weight="600" text-anchor="start">模型</text><text x="1008" y="498" font-size="16" fill="#7c3aed" font-weight="400" text-anchor="start">checkpoint</text><g><rect x="36" y="420" width="340" height="94" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity=".22"/><text x="54" y="449" font-size="19" fill="#b45309" font-weight="700" text-anchor="start">监督真值 GT · 独立路径</text><text x="54" y="477" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">未来 6 × 0.5 秒 ego pose → 轨迹</text><text x="54" y="503" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">用于训练监督与评估对比</text></g><path d="M206 380V420" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="side" marker-end="url(#amber)"/><path d="M600 380V405H788V605H824" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="side" marker-end="url(#blue)"/><text x="438" y="396" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">held-out 图像 / 问题 / 场景上下文</text><path d="M376 467H808V690H824" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="side" marker-end="url(#amber)"/><text x="410" y="457" font-size="16" fill="#b45309" font-weight="600" text-anchor="start">GT 只送入指标对比，不送入预测输入</text><g><rect x="824" y="560" width="340" height="242" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="824" y="560" width="340" height="52" rx="18" fill="#eff6ff"/><path d="M824 594h340v18H824z" fill="#eff6ff"/><rect x="842" y="574" width="30" height="26" rx="8" fill="#2563eb"/><text x="857" y="593" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">04</text><text x="885" y="594" font-size="21" fill="#172554" font-weight="700" text-anchor="start">20 次离线评估</text><text x="844" y="643" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">A：4 配置 × 3 seed = 12 次</text><text x="844" y="672" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">B / C / D：8 次，A4 seed42 参考</text><text x="844" y="701" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">每次 180 条；greedy 不采样</text><text x="844" y="730" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">预测 RAT → 解析 → 与 GT 对比</text><text x="844" y="759" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">ADE / FDE / parse / 一致性等</text></g><g><rect x="430" y="560" width="340" height="242" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="430" y="560" width="340" height="52" rx="18" fill="#eff6ff"/><path d="M430 594h340v18H430z" fill="#eff6ff"/><rect x="448" y="574" width="30" height="26" rx="8" fill="#2563eb"/><text x="463" y="593" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">05</text><text x="491" y="594" font-size="21" fill="#172554" font-weight="700" text-anchor="start">自动汇总发布数据</text><text x="450" y="643" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">20 份 metrics + 20 份 predictions</text><text x="450" y="672" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">共 3600 条预测输出</text><text x="450" y="701" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">按 seed / 条件汇总指标</text><text x="450" y="730" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">生成 results_summary 与数据表</text><text x="450" y="759" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">脚本含逐样本 Wilcoxon 检验</text></g><g><rect x="36" y="560" width="340" height="242" rx="18" fill="#fff" stroke="#dce4ef"/><rect x="36" y="560" width="340" height="52" rx="18" fill="#ecfdf5"/><path d="M36 594h340v18H36z" fill="#ecfdf5"/><rect x="54" y="574" width="30" height="26" rx="8" fill="#059669"/><text x="69" y="593" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">06</text><text x="97" y="594" font-size="21" fill="#172554" font-weight="700" text-anchor="start">Final 统计复核与结论</text><text x="56" y="643" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">识别同场景样本的聚类影响</text><text x="56" y="672" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">9 场景配对 + cluster bootstrap</text><text x="56" y="701" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">5000 次重采样，修正统计解释</text><text x="56" y="730" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">主报告 + findings + 数据校验和</text><text x="56" y="759" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">无显著差异 / 行为塌缩等结论</text></g><path d="M824 754H770" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#blue)"/><path d="M430 754H376" fill="none" stroke="#059669" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="flow" marker-end="url(#green)"/><g><rect x="36" y="850" width="1128" height="116" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".22"/><text x="54" y="879" font-size="19" fill="#2563eb" font-weight="700" text-anchor="start">这张图的阅读边界</text><text x="54" y="907" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">蓝色：数据与离线评估；紫色：训练模型；金色：GT 真值；绿色：最终分析与发布。</text><text x="54" y="933" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">开环中没有车辆执行、CARLA 控制反馈或在线再训练；自动汇总与 Final 场景感知统计复核分开呈现。</text></g><text x="36" y="1013" font-size="17" fill="#53627b" font-weight="400" text-anchor="start">流线表示处理顺序与反馈方向；这是流程演示动画，不是实时遥测。</text><text x="36" y="1041" font-size="16" fill="#53627b" font-weight="400" text-anchor="start">依据：A–D Final 报告、scene-disjoint 清单及 abcd_full 训练 / 评估脚本。</text></svg>